# Builds the app image on every branch push and publishes it to
# ghcr.io/<owner>/sfgc, tagged with the branch name (slashes and other
# characters not allowed in a tag become '-', e.g. feature/x -> feature-x).

name: Docker image

on:
  push:
    branches: ["**"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Image name
        id: image
        # GHCR needs a lowercase repository path.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sfgc" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: type=ref,event=branch

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
